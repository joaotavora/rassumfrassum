name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.14']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install coreutils (for 'timeout')
      if: runner.os == 'macOS'
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
      run: brew install coreutils

    # Up front, else installing eats into the vuetail test's timeout.
    # Not on Windows, where that test is skipped.
    - name: Install vuetail test fixture
      if: runner.os != 'Windows'
      run: npm install --silent --prefix test/vuetail/fixture

    - name: Run tests
      shell: bash
      # Timing-sensitive tests get flaky when 8 of them compete for
      # the runners' few cores
      run: BATCH_SIZE=4 test/run-all.sh
